[package]
name = "mameuix"
version = "0.1.7"
edition = "2024"
rust-version = "1.88"
autoexamples = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
eframe = "0.32"
egui = "0.32"
egui_extras = "0.32"  # ADD THIS - needed for optimized table rendering
egui_dock = "0.17"
egui-toast = "0.18"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
toml = "0.9.2"
walkdir = "2.5"
dirs = "6.0"
anyhow = "1.0.98"
image = { version = "0.25.6", features = ["png", "jpeg", "ico"] }
rfd = "0.15.4"
rayon = "1.10"
num_cpus = "1.17"
zip = "4.3"
chrono = { version = "0.4.41", features = ["serde"] }
quick-xml = "0.41"
webbrowser = "1.2.2"
fuzzy-matcher = "0.3.7"
# Upstream lru >=0.18.2 security fix; replace with a release once available.
tantivy = { git = "https://github.com/quickwit-oss/tantivy", rev = "5ca39332002c2c87fb5d2abc707cf527b3319d42" }
regex = "1.11"
lazy_static = "1.5"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.20"

